plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '2.4'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        // This compiles against Java 17 but installs on Android 11, so a call to an API newer than
        // minSdk compiles cleanly and then dies with NoSuchMethodError on the device. NewApi is what
        // catches that; it already did for the Spotify urls once, but only when lint was run by hand.
        // Checked on release so it is part of the build that gets installed.
        checkReleaseBuilds true
        abortOnError true
        // Everything else stays a warning: the launcher is sideloaded, and the policy here is that
        // only correctness issues block a build.
        warningsAsErrors false
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    // Test only: the unit tests run against a stub org.json that throws on every call, so the Plex
    // parsing tests need the real implementation on the test classpath. It is the same API the
    // platform provides at runtime, so nothing here ships in the APK.
    testImplementation 'org.json:json:20240303'
}
